name: Add book from issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  # Only the repo owner may use the issue pipeline; close everything else.
  close-unauthorized:
    if: github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close and lock issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Thanks for your interest! This repo doesn't accept issues from other users — if you have a book recommendation, please reach out to me directly instead."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "not planned"
          gh issue lock "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

  add-book:
    if: contains(github.event.issue.labels.*.name, 'add-book') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse issue form
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          section() {
            echo "$ISSUE_BODY" | awk -v h="### $1" '
              $0 == h {grab=1; next}
              /^### / {grab=0}
              grab && !/^[[:space:]]*$/ && $0 != "_No response_"' | head -c 2000
          }
          {
            echo "asin=$(section 'ASIN or Audible URL' | head -1 | tr -d '\r')"
            echo "category=$(section 'Category' | head -1 | tr -d '\r')"
            echo "blurb<<BLURB_EOF"
            section 'Custom blurb (optional)'
            echo "BLURB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add the book and push to main
        id: add
        env:
          ASIN: ${{ steps.parse.outputs.asin }}
          CATEGORY: ${{ steps.parse.outputs.category }}
          BLURB: ${{ steps.parse.outputs.blurb }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_script() {
            if [ -n "$BLURB" ]; then
              node scripts/add-book.mjs "$ASIN" --category "$CATEGORY" --blurb "$BLURB" 2>&1
            else
              node scripts/add-book.mjs "$ASIN" --category "$CATEGORY" 2>&1
            fi
          }

          STATUS=1
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard FETCH_HEAD --quiet
            OUTPUT=$(run_script)
            STATUS=$?
            echo "$OUTPUT"
            [ $STATUS -ne 0 ] && break
            git add books.json
            git commit -q -m "Add book $ASIN (requested in #${{ github.event.issue.number }})"
            if git push origin HEAD:main; then
              STATUS=0
              break
            fi
            echo "Push rejected (concurrent update), retrying ($attempt/5)..."
            OUTPUT="Push to main kept failing after retries — reopen the issue to try again."
            STATUS=1
            sleep $((attempt * 3))
          done

          {
            echo "message<<OUT_EOF"
            echo "$OUTPUT"
            echo "OUT_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Comment and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            ✅ ${{ steps.add.outputs.message }}

            It's committed to `main` and will be live on the site in a minute or two.
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Comment failure on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            ❌ Could not add this book automatically:

            ```
            ${{ steps.add.outputs.message || 'Failed before metadata lookup — check the workflow logs.' }}
            ```

            Double-check the ASIN/URL and reopen this issue to retry, or add it to books.json manually.
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
