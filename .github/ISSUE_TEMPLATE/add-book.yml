name: Add a book
description: Add a book to the site from its Audible page. A PR with the book's metadata will be opened automatically.
title: "[Add Book]: "
labels: ["add-book"]
body:
  - type: input
    id: asin
    attributes:
      label: ASIN or Audible URL
      description: "Paste the Audible product URL (audible.com/pd/…) or just the 10-character ASIN."
      placeholder: "https://www.audible.com/pd/B01CF5O89G or B01CF5O89G"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Fiction - Sci-Fi & Dystopian
        - Fiction - Thrillers & Horror
        - Fiction - Literary & Classics
        - Non Fiction - Business & Finance
        - Non Fiction - Silicon Valley & Tech
        - Non Fiction - Science & Medicine
        - Non Fiction - Psychology & the Mind
        - Non Fiction - Love & Relationships
        - Non Fiction - Society & Culture
        - Non Fiction - History
        - Non Fiction - True Crime
        - Non Fiction - Biography & Memoir
        - Non Fiction - Life Skills & Philosophy
    validations:
      required: true
  - type: textarea
    id: blurb
    attributes:
      label: Custom blurb (optional)
      description: Leave blank to use the description from Audible.
    validations:
      required: false
